<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Огонёк</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Главный экран -->
    <div id="main-screen" class="screen active">
        <div class="header">
            <div class="exp-counter">⭐ <span id="expDisplay">0</span></div>
            <button id="spiderBtn" class="spider-btn">🕷️</button>
        </div>

        <div class="fire-container">
            <div class="fire-glow"></div>
            <div class="fire-emoji">🔥</div>
        </div>

        <div class="day-counter">
            <span id="dayCount">0</span> дней
        </div>

        <div class="weekdays">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>

        <div class="calendar" id="calendar">
            <!-- числа генерируются JS -->
        </div>

        <button id="activateBtn" class="activate-btn">🔥 Активировать</button>

        <div class="achievements">
            <div class="achieve" data-days="3">3д ✅</div>
            <div class="achieve" data-days="5">5д ✅</div>
            <div class="achieve" data-days="10">10д ✅</div>
            <div class="achieve" data-days="20">20д ✅</div>
            <div class="achieve" data-days="30">30д 🏆</div>
        </div>
    </div>

    <!-- Окно паутинки -->
    <div id="spider-screen" class="screen">
        <button class="back-btn" id="backBtn">← Назад</button>
        <h2>📊 Характеристики</h2>
        <div class="spider-container">
            <canvas id="spiderCanvas" width="300" height="300"></canvas>
        </div>
        <div class="stats-list">
            <div><span>💪 Сила</span> <span class="stat-val" data-stat="strength">1</span> <button class="up-btn" data-stat="strength">+</button></div>
            <div><span>❤️ Здоровье</span> <span class="stat-val" data-stat="health">1</span> <button class="up-btn" data-stat="health">+</button></div>
            <div><span>🛡️ Защита</span> <span class="stat-val" data-stat="defense">1</span> <button class="up-btn" data-stat="defense">+</button></div>
            <div><span>💨 Ловкость</span> <span class="stat-val" data-stat="agility">1</span> <button class="up-btn" data-stat="agility">+</button></div>
            <div><span>🧠 Интеллект</span> <span class="stat-val" data-stat="intelligence">1</span> <button class="up-btn" data-stat="intelligence">+</button></div>
            <div><span>🔮 Магия</span> <span class="stat-val" data-stat="magic">1</span> <button class="up-btn" data-stat="magic">+</button></div>
        </div>
        <div class="promo-area">
            <input type="text" id="promoInput" placeholder="Введите промокод">
            <button id="promoBtn">Активировать</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
