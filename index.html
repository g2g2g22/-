<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колония Кубов</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <div id="header">
            <div class="coins-display">
                🪙 <span id="coins">0</span>
            </div>
        </div>

        <!-- Куб для клика -->
        <div id="cube-container">
            <div id="cube" onclick="handleClick()">
                🎲
            </div>
            <div id="click-animation"></div>
        </div>

        <!-- Информация -->
        <div id="info">
            <div class="info-item">
                💪 <span id="clickPower">1</span>x
            </div>
            <div class="info-item">
                ⚡ <span id="passiveIncome">0</span>/ч
            </div>
        </div>

        <!-- Кнопки внизу -->
        <div id="bottom-menu">
            <button onclick="showTab('main')" class="tab-btn active" id="tab-main">
                🏠
            </button>
            <button onclick="showTab('generators')" class="tab-btn" id="tab-generators">
                🏭
            </button>
            <button onclick="showTab('boosters')" class="tab-btn" id="tab-boosters">
                ⚡
            </button>
            <button onclick="showTab('stats')" class="tab-btn" id="tab-stats">
                📊
            </button>
        </div>

        <!-- Панели -->
        <div id="panels">
            <!-- Главная панель -->
            <div id="panel-main" class="panel active">
                <button id="collectBtn" onclick="collectPassive()" class="action-btn">
                    📥 Собрать пассивку
                </button>
                <button onclick="upgradeClick()" class="action-btn">
                    💪 Улучшить клик
                </button>
            </div>

            <!-- Генераторы -->
            <div id="panel-generators" class="panel">
                <div id="generators-list"></div>
            </div>

            <!-- Бустеры -->
            <div id="panel-boosters" class="panel">
                <div class="booster-item">
                    <span>⏳ Ускорение на 1 час</span>
                    <button onclick="buyBooster('hour_boost')">Купить 5000🪙</button>
                </div>
                <div class="booster-item">
                    <span>💰 Мешок монет (+10%)</span>
                    <button onclick="buyBooster('coin_bag')">Купить 2000🪙</button>
                </div>
                <div class="booster-item">
                    <span>🎯 Супер-клик (x10)</span>
                    <button onclick="buyBooster('super_click')">Купить 3000🪙</button>
                </div>
                <div id="boosters-count"></div>
            </div>

            <!-- Статистика -->
            <div id="panel-stats" class="panel">
                <div id="stats-content"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
