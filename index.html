<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колония Кубов</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <div id="header">
            <div class="coins-display">
                🪙 <span id="coins">0</span>
            </div>
            <button id="diceBtn" onclick="openDiceGame()">🎲</button>
        </div>

        <!-- Контейнер с кубами -->
        <div id="cube-container">
            <!-- Главный куб -->
            <div id="main-cube" onclick="handleClick()">
                🎲
            </div>
            
            <!-- Мини-кубы генераторов (статичные вокруг) -->
            <div id="mini-cubes"></div>
            
            <!-- Анимация клика -->
            <div id="click-animation"></div>
        </div>

        <!-- Информация -->
        <div id="info">
            <div class="info-item">
                💪 <span id="clickPower">1</span>x
            </div>
            <div class="info-item">
                ⚡ <span id="passiveIncome">0</span>/ч
            </div>
        </div>

        <!-- Нижнее меню -->
        <div id="bottom-menu">
            <button onclick="showTab('main')" class="tab-btn active" id="tab-main">🏠</button>
            <button onclick="showTab('generators')" class="tab-btn" id="tab-generators">🏭</button>
            <button onclick="showTab('boosters')" class="tab-btn" id="tab-boosters">⚡</button>
            <button onclick="showTab('stats')" class="tab-btn" id="tab-stats">📊</button>
        </div>

        <!-- Панели -->
        <div id="panels">
            <!-- Главная панель -->
            <div id="panel-main" class="panel active">
                <button id="collectBtn" onclick="collectPassive()" class="action-btn">
                    📥 Собрать пассивку
                </button>
                <button onclick="upgradeClick()" class="action-btn">
                    💪 Улучшить клик
                </button>
            </div>

            <!-- Генераторы -->
            <div id="panel-generators" class="panel">
                <div id="generators-list"></div>
            </div>

            <!-- Бустеры -->
            <div id="panel-boosters" class="panel">
                <div class="booster-item">
                    <span>⏳ Ускорение на 1 час</span>
                    <button onclick="buyBooster('hour_boost')">Купить 5000🪙</button>
                </div>
                <div class="booster-item">
                    <span>💰 Мешок монет (+10%)</span>
                    <button onclick="buyBooster('coin_bag')">Купить 2000🪙</button>
                </div>
                <div class="booster-item">
                    <span>🎯 Супер-клик (x10)</span>
                    <button onclick="buyBooster('super_click')">Купить 3000🪙</button>
                </div>
                <div id="boosters-count"></div>
            </div>

            <!-- Статистика -->
            <div id="panel-stats" class="panel">
                <div id="stats-content"></div>
            </div>
        </div>
    </div>

    <!-- Окно игры в кубики (поверх всего) -->
    <div id="dice-overlay" style="display:none;">
        <div id="dice-modal">
            <div id="dice-modal-header">
                <span>🎲 Бросок кубиков</span>
                <button onclick="closeDiceGame()">✕</button>
            </div>
            <div id="dice-modal-body">
                <div id="dice-result"></div>
                <div id="dice-controls-modal">
                    <div class="dice-selector">
                        <button class="dice-count" data-count="1" onclick="selectDiceCount(1)">1</button>
                        <button class="dice-count active" data-count="2" onclick="selectDiceCount(2)">2</button>
                        <button class="dice-count" data-count="3" onclick="selectDiceCount(3)">3</button>
                        <button class="dice-count" data-count="4" onclick="selectDiceCount(4)">4</button>
                        <button class="dice-count" data-count="5" onclick="selectDiceCount(5)">5</button>
                    </div>
                    <button id="rollDiceBtn" onclick="rollDice()">🎲 Крутить!</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
