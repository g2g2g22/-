<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Куб Кликер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #0a0a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
            color: white;
        }
        
        #app {
            max-width: 400px;
            width: 100%;
            background: #141428;
            border-radius: 20px;
            padding: 20px 15px;
        }
        
        #balance {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
            padding: 15px;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        #cube {
            width: 160px;
            height: 160px;
            margin: 10px auto;
            background: linear-gradient(135deg, #ffd700, #f0a500);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b8860b;
            transition: all 0.1s;
            touch-action: manipulation;
        }
        
        #cube:active {
            transform: scale(0.9);
            box-shadow: 0 3px 0 #b8860b;
        }
        
        #info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            font-size: 14px;
            color: #aaa;
        }
        
        #info span {
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 14px;
            border-radius: 10px;
        }
        
        #claimBtn {
            width: 100%;
            padding: 14px;
            background: #4ecdc4;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #2a7a72;
            margin-bottom: 15px;
            touch-action: manipulation;
        }
        
        #claimBtn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 0 #2a7a72;
        }
        
        #claimBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 10px;
        }
        
        .tab {
            flex: 1;
            padding: 10px 4px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: rgba(255, 215, 0, 0.12);
            color: #ffd700;
        }
        
        .tab-content {
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .generator {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .generator .icon {
            font-size: 28px;
        }
        
        .generator .info {
            flex: 1;
            font-size: 13px;
        }
        
        .generator .info .name {
            font-weight: 600;
        }
        
        .generator .info .desc {
            color: #888;
            font-size: 11px;
        }
        
        .generator button {
            background: #ffd700;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            color: #1a1a2e;
            cursor: pointer;
            font-size: 12px;
            touch-action: manipulation;
        }
        
        .generator button:active {
            transform: scale(0.92);
        }
        
        .generator button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .generator button small {
            display: block;
            font-size: 9px;
        }
        
        .booster-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .booster-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .booster-card .emoji {
            font-size: 30px;
        }
        
        .booster-card .price {
            color: #ffd700;
            font-size: 12px;
            margin: 4px 0 8px;
        }
        
        .booster-card button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            touch-action: manipulation;
            width: 100%;
        }
        
        .booster-card button:active {
            transform: scale(0.92);
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        
        .stat-item span {
            color: #ffd700;
            font-weight: bold;
        }
        
        #activeBoosters {
            margin-top: 10px;
            text-align: center;
            color: #666;
        }
        
        .active-booster {
            background: rgba(78, 205, 196, 0.12);
            border: 1px solid rgba(78, 205, 196, 0.15);
            border-radius: 8px;
            padding: 4px 10px;
            display: inline-block;
            margin: 3px;
            font-size: 12px;
            color: #4ecdc4;
        }
        
        .floating {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            font-weight: bold;
            pointer-events: none;
            z-index: 999;
            animation: floatUp 0.7s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1.3); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        #cube.rotate {
            animation: spin 0.3s ease;
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 10px; }
        
        @media (max-width: 400px) {
            #cube { width: 130px; height: 130px; font-size: 65px; }
            #balance { font-size: 26px; }
        }
    </style>
</head>
<body>

<div id="app">
    <div id="balance">🪙 <span id="coins">0</span></div>
    
    <div id="cube" onclick="clickCube()">🎲</div>
    
    <div id="info">
        <span>💪 <span id="clickPower">1</span>x</span>
        <span>⚡ <span id="incomePerHour">0</span>/час</span>
    </div>
    
    <button id="claimBtn" onclick="claimPassive()">📥 Собрать пассивку</button>
    
    <div class="tabs">
        <button class="tab active" onclick="switchTab('generators')">📊 Генераторы</button>
        <button class="tab" onclick="switchTab('boosters')">⚡ Бустеры</button>
        <button class="tab" onclick="switchTab('stats')">📈 Статистика</button>
    </div>
    
    <div id="generators" class="tab-content active">
        <div id="generatorsList"></div>
    </div>
    
    <div id="boosters" class="tab-content">
        <div class="booster-grid">
            <div class="booster-card">
                <div class="emoji">⚡</div>
                <div>x2 на 5 мин</div>
                <div class="price">500 🪙</div>
                <button onclick="buyBooster('x2')">Купить</button>
            </div>
            <div class="booster-card">
                <div class="emoji">🔥</div>
                <div>x5 на 2 мин</div>
                <div class="price">2000 🪙</div>
                <button onclick="buyBooster('x5')">Купить</button>
            </div>
            <div class="booster-card">
                <div class="emoji">🤖</div>
                <div>Авто-клик 1 мин</div>
                <div class="price">5000 🪙</div>
                <button onclick="buyBooster('auto')">Купить</button>
            </div>
        </div>
        <div id="activeBoosters"></div>
    </div>
    
    <div id="stats" class="tab-content">
        <div class="stat-item">Всего кликов: <span id="statClicks">0</span></div>
        <div class="stat-item">Заработано: <span id="statEarned">0</span></div>
        <div class="stat-item">Доход/час: <span id="statIncome">0</span></div>
        <div class="stat-item">Генераторов: <span id="statGenerators">0</span></div>
    </div>
</div>

<script>
// ============================================
// КОНФИГ
// ============================================
const GENERATORS = [
    { id: 'farm', name: 'Кубо-ферма', icon: '🏭', basePrice: 100, baseIncome: 10 },
    { id: 'reactor', name: 'Энерго-куб', icon: '⚡', basePrice: 500, baseIncome: 50 },
    { id: 'mine', name: 'Кубо-шахта', icon: '⛏️', basePrice: 3000, baseIncome: 300 },
    { id: 'factory', name: 'Кубо-завод', icon: '🏗️', basePrice: 15000, baseIncome: 1500 },
    { id: 'satellite', name: 'Куб-спутник', icon: '🛰️', basePrice: 80000, baseIncome: 8000 },
    { id: 'singularity', name: 'Сингулярность', icon: '🌀', basePrice: 500000, baseIncome: 50000 },
];

// ============================================
= СОСТОЯНИЕ
// ============================================
let game = {
    coins: 0,
    totalClicks: 0,
    totalEarned: 0,
    clickPower: 1,
    generators: {},
    boosters: [],
    lastClaim: Date.now()
};

GENERATORS.forEach(g => { if (!(g.id in game.generators)) game.generators[g.id] = 0; });

// ============================================
= СОХРАНЕНИЕ
// ============================================
function loadGame() {
    try {
        const saved = localStorage.getItem('cubeClicker');
        if (saved) {
            const parsed = JSON.parse(saved);
            game = { ...game, ...parsed };
            GENERATORS.forEach(g => { if (!(g.id in game.generators)) game.generators[g.id] = 0; });
        }
    } catch(e) {}
    saveGame();
}

function saveGame() {
    try { localStorage.setItem('cubeClicker', JSON.stringify(game)); } catch(e) {}
}

// ============================================
= ПОМОЩНИКИ
// ============================================
function formatNum(n) {
    if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
    if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
    if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
    return Math.floor(n).toString();
}

function getIncome() {
    let total = 0;
    GENERATORS.forEach(g => {
        const level = game.generators[g.id] || 0;
        if (level > 0) total += g.baseIncome * Math.pow(1.3, level - 1);
    });
    const now = Date.now();
    game.boosters = game.boosters.filter(b => b.expiresAt > now);
    let bonus = 1;
    game.boosters.forEach(b => { if (b.type === 'x2') bonus = Math.max(bonus, 2); if (b.type === 'x5') bonus = Math.max(bonus, 5); });
    return Math.floor(total * bonus);
}

function getPrice(genId) {
    const config = GENERATORS.find(g => g.id === genId);
    const level = game.generators[genId] || 0;
    return Math.floor(config.basePrice * Math.pow(1.5, level));
}

function getGenIncome(genId) {
    const config = GENERATORS.find(g => g.id === genId);
    const level = game.generators[genId] || 0;
    if (level === 0) return 0;
    return Math.floor(config.baseIncome * Math.pow(1.3, level - 1));
}

// ============================================
= UI
// ============================================
function updateUI() {
    document.getElementById('coins').textContent = formatNum(game.coins);
    document.getElementById('clickPower').textContent = game.clickPower;
    
    const income = getIncome();
    document.getElementById('incomePerHour').textContent = formatNum(income);
    
    // Генераторы
    const container = document.getElementById('generatorsList');
    container.innerHTML = '';
    GENERATORS.forEach(g => {
        const level = game.generators[g.id] || 0;
        const price = getPrice(g.id);
        const genIncome = getGenIncome(g.id);
        const canAfford = game.coins >= price;
        
        const div = document.createElement('div');
        div.className = 'generator';
        div.innerHTML = `
            <span class="icon">${g.icon}</span>
            <div class="info">
                <div class="name">${g.name}</div>
                <div class="desc">Уровень ${level} ${level > 0 ? '· ' + formatNum(genIncome) + '/час' : ''}</div>
            </div>
            <button ${!canAfford ? 'disabled' : ''} onclick="buyGenerator('${g.id}')">
                ${level === 0 ? 'Куп' : '⬆'}
                <small>${formatNum(price)}</small>
            </button>
        `;
        container.appendChild(div);
    });
    
    // Статистика
    document.getElementById('statClicks').textContent = formatNum(game.totalClicks);
    document.getElementById('statEarned').textContent = formatNum(game.totalEarned);
    document.getElementById('statIncome').textContent = formatNum(income);
    let totalLevels = 0;
    Object.values(game.generators).forEach(v => totalLevels += v);
    document.getElementById('statGenerators').textContent = totalLevels;
    
    // Бустеры
    const now = Date.now();
    game.boosters = game.boosters.filter(b => b.expiresAt > now);
    const boostContainer = document.getElementById('activeBoosters');
    if (game.boosters.length === 0) {
        boostContainer.innerHTML = 'Нет активных бустеров';
    } else {
        boostContainer.innerHTML = game.boosters.map(b => {
            const left = Math.ceil((b.expiresAt - now) / 1000);
            const m = Math.floor(left / 60);
            const s = left % 60;
            const emoji = b.type === 'x2' ? '⚡' : b.type === 'x5' ? '🔥' : '🤖';
            return `<span class="active-booster">${emoji} ${b.type} ${m}:${String(s).padStart(2,'0')}</span>`;
        }).join('');
    }
    
    // Кнопка сбора
    const btn = document.getElementById('claimBtn');
    if (income === 0) {
        btn.textContent = '📥 Купи генераторы';
        btn.disabled = true;
    } else {
        btn.textContent = '📥 Собрать пассивку';
        btn.disabled = false;
    }
}

function floating(text, color = '#ffd700') {
    const el = document.createElement('div');
    el.className = 'floating';
    el.textContent = text;
    el.style.color = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
}

// ============================================
= КЛИК
// ============================================
function clickCube() {
    const cube = document.getElementById('cube');
    cube.classList.remove('rotate');
    void cube.offsetWidth;
    cube.classList.add('rotate');
    
    let earn = game.clickPower;
    const now = Date.now();
    game.boosters = game.boosters.filter(b => b.expiresAt > now);
    let bonus = 1;
    game.boosters.forEach(b => {
        if (b.type === 'x2') bonus = Math.max(bonus, 2);
        if (b.type === 'x5') bonus = Math.max(bonus, 5);
    });
    earn *= bonus;
    
    game.coins += earn;
    game.totalClicks++;
    game.totalEarned += earn;
    
    floating('+'+formatNum(earn)+' 🪙');
    saveGame();
    updateUI();
}

// ============================================
= ПОКУПКИ
// ============================================
function buyGenerator(genId) {
    const price = getPrice(genId);
    if (game.coins < price) return;
    game.coins -= price;
    game.generators[genId] = (game.generators[genId] || 0) + 1;
    saveGame();
    updateUI();
}

function buyBooster(type) {
    const prices = { x2: 500, x5: 2000, auto: 5000 };
    const durations = { x2: 300, x5: 120, auto: 60 };
    if (game.coins < prices[type]) { floating('❌ Не хватает', '#ff6b6b'); return; }
    game.coins -= prices[type];
    game.boosters.push({ type: type, expiresAt: Date.now() + durations[type] * 1000 });
    saveGame();
    updateUI();
    floating('⚡ '+type.toUpperCase()+' активирован!', '#4ecdc4');
}

function claimPassive() {
    const now = Date.now();
    const diff = (now - game.lastClaim) / 1000;
    const income = getIncome();
    const earned = Math.floor(diff * (income / 3600));
    if (earned <= 0) { floating('⏳ Подожди', '#aaa'); return; }
    game.coins += earned;
    game.totalEarned += earned;
    game.lastClaim = now;
    saveGame();
    updateUI();
    floating('+'+formatNum(earned)+' 🪙', '#4ecdc4');
}

// ============================================
= ВКЛАДКИ
// ============================================
function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
}

// ============================================
= ТИКЕР
// ============================================
setInterval(() => {
    const income = getIncome();
    if (income > 0) {
        game.coins += income / 3600;
        saveGame();
        updateUI();
    }
}, 1000);

setInterval(() => {
    const now = Date.now();
    game.boosters = game.boosters.filter(b => b.expiresAt > now);
    if (game.boosters.some(b => b.type === 'auto')) {
        clickCube();
    }
}, 2000);

// ============================================
= ЗАПУСК
// ============================================
loadGame();
updateUI();
console.log('🎲 Куб-кликер работает!');
</script>

</body>
</html>
