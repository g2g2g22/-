<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Огонёк</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Главный экран -->
    <div id="main-screen" class="screen active">
        <!-- Верхние кнопки -->
        <div class="top-buttons">
            <button class="top-btn" id="cardsBtn">🃏</button>
            <button class="top-btn" id="weaponBtn">🗡</button>
            <button class="top-btn" id="diceBtn">🎲</button>
            <button class="top-btn" id="spiderBtn">🧬</button>
        </div>

        <!-- Очки опыта -->
        <div class="exp-display">🧬 <span id="expDisplay">0</span></div>

        <!-- Огонь по центру -->
        <div class="fire-wrapper">
            <div class="fire-glow"></div>
            <div class="sparkles" id="sparkles"></div>
            <div class="fire-emoji">🔥</div>
        </div>

        <!-- Счётчик дней -->
        <div class="day-counter">
            <span id="dayCount">0</span> дней
        </div>

        <!-- Дни недели -->
        <div class="weekdays">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>

        <!-- Календарь (текущая неделя) -->
        <div class="calendar" id="calendar"></div>

        <!-- Кнопка зажечь огонь -->
        <button id="activateBtn" class="activate-btn">🔥 Зажечь огонь</button>
    </div>

    <!-- Окно характеристик -->
    <div id="spider-screen" class="screen">
        <button class="back-btn" id="backBtn">← Назад</button>
        <h2>Характеристики</h2>
        <div class="stats-list">
            <div><span>💪 Сила</span> <span class="stat-info">(<span class="stat-spent" data-stat="strength">0</span>)</span> <span class="stat-val" data-stat="strength">1</span> <button class="up-btn" data-stat="strength">+</button></div>
            <div><span>❤️ Здоровье</span> <span class="stat-info">(<span class="stat-spent" data-stat="health">0</span>)</span> <span class="stat-val" data-stat="health">1</span> <button class="up-btn" data-stat="health">+</button></div>
            <div><span>🛡 Защита</span> <span class="stat-info">(<span class="stat-spent" data-stat="defense">0</span>)</span> <span class="stat-val" data-stat="defense">1</span> <button class="up-btn" data-stat="defense">+</button></div>
            <div><span>💨 Ловкость</span> <span class="stat-info">(<span class="stat-spent" data-stat="agility">0</span>)</span> <span class="stat-val" data-stat="agility">1</span> <button class="up-btn" data-stat="agility">+</button></div>
            <div><span>🧠 Интеллект</span> <span class="stat-info">(<span class="stat-spent" data-stat="intelligence">0</span>)</span> <span class="stat-val" data-stat="intelligence">1</span> <button class="up-btn" data-stat="intelligence">+</button></div>
            <div><span>🔮 Магия</span> <span class="stat-info">(<span class="stat-spent" data-stat="magic">0</span>)</span> <span class="stat-val" data-stat="magic">1</span> <button class="up-btn" data-stat="magic">+</button></div>
        </div>
        <div class="promo-area">
            <input type="text" id="promoInput" placeholder="Промокод">
            <button id="promoBtn">Активировать</button>
        </div>
    </div>

    <!-- Окно кубиков -->
    <div id="dice-screen" class="screen">
        <button class="back-btn" id="diceBackBtn">← Назад</button>
        <h2>🎲 Кубики</h2>
        <!-- Кубики по центру -->
        <div class="dice-container" id="diceContainer">
            <div class="dice" id="dice1">⚀</div>
            <div class="dice" id="dice2">⚀</div>
            <div class="dice" id="dice3">⚀</div>
            <div class="dice" id="dice4">⚀</div>
            <div class="dice" id="dice5">⚀</div>
        </div>
        <!-- Управление внизу -->
        <div class="dice-controls">
            <div class="dice-count">
                <button class="dice-count-btn active" data-count="1">1</button>
                <button class="dice-count-btn" data-count="2">2</button>
                <button class="dice-count-btn" data-count="3">3</button>
                <button class="dice-count-btn" data-count="4">4</button>
                <button class="dice-count-btn" data-count="5">5</button>
            </div>
            <button id="rollBtn" class="roll-btn">🎲 Крутить!</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
