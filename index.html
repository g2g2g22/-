<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Куб Кликер 🎲</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <div class="header">
            <div class="balance">
                <span class="coin-icon">🪙</span>
                <span id="coins">0</span>
            </div>
            <div class="income">
                ⚡ <span id="incomePerHour">0</span>/час
            </div>
        </div>

        <!-- Куб -->
        <div class="cube-wrapper" id="cubeWrapper">
            <div class="cube" id="cube">
                <div class="cube-face front">🎲</div>
                <div class="cube-face back">⬛</div>
                <div class="cube-face right">🔴</div>
                <div class="cube-face left">🟢</div>
                <div class="cube-face top">🟡</div>
                <div class="cube-face bottom">🔵</div>
            </div>
        </div>

        <!-- Статистика клика -->
        <div class="click-info">
            <span>💪 Мощность клика: <strong id="clickPower">1</strong></span>
            <span>🎯 Кликов: <strong id="totalClicks">0</strong></span>
        </div>

        <!-- Кнопка сбора пассивки -->
        <button class="claim-btn" id="claimBtn">
            📥 Собрать пассивный доход
        </button>

        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab active" data-tab="generators">📊 Генераторы</button>
            <button class="tab" data-tab="boosters">⚡ Бустеры</button>
            <button class="tab" data-tab="stats">📈 Статистика</button>
        </div>

        <!-- Контент вкладок -->
        <div class="tab-content">
            <!-- Генераторы -->
            <div id="generators" class="tab-panel active">
                <div id="generatorsList"></div>
            </div>

            <!-- Бустеры -->
            <div id="boosters" class="tab-panel">
                <div class="booster-grid">
                    <div class="booster-card" data-booster="x2">
                        <div class="booster-icon">⚡</div>
                        <div class="booster-name">x2 на 5 мин</div>
                        <div class="booster-price">500 🪙</div>
                        <button class="buy-booster">Купить</button>
                    </div>
                    <div class="booster-card" data-booster="x5">
                        <div class="booster-icon">🔥</div>
                        <div class="booster-name">x5 на 2 мин</div>
                        <div class="booster-price">2000 🪙</div>
                        <button class="buy-booster">Купить</button>
                    </div>
                    <div class="booster-card" data-booster="auto">
                        <div class="booster-icon">🤖</div>
                        <div class="booster-name">Авто-кликер 1 мин</div>
                        <div class="booster-price">5000 🪙</div>
                        <button class="buy-booster">Купить</button>
                    </div>
                </div>
                <div id="activeBoosters" style="margin-top: 15px; text-align: center; color: #aaa;"></div>
            </div>

            <!-- Статистика -->
            <div id="stats" class="tab-panel">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-label">Всего кликов</span>
                        <span class="stat-value" id="statClicks">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Всего заработано</span>
                        <span class="stat-value" id="statEarned">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Доход в час</span>
                        <span class="stat-value" id="statIncome">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Куплено генераторов</span>
                        <span class="stat-value" id="statGenerators">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
